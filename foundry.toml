[profile.default]
solc_version = '0.8.33'
evm_version = 'cancun' 
optimizer = true
optimizer_runs = 200
src = 'src'
out = 'out'
libs = ['lib']
test = 'test'
cache_path = 'cache_forge'
fs_permissions = [{ access = "read", path = "./test/bin" }]
auto_detect_remappings = false

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@src/contracts/=src/contracts/",
    "forge-std/=lib/forge-std/src/"
]

[fuzz]
runs = 5000
max_test_rejects = 150000

[rpc_endpoints]
arbitrum-sepolia = "${ARBITRUM_RPC}"
robinhood-chain = "https://rpc.mainnet.chain.robinhood.com"
arc-testnet = "https://rpc.testnet.arc.network"

[etherscan]
arbitrum_sepolia = { key = "${ARBITRUM_API_KEY}" }
robinhood_chain = { key = "empty", url = "https://robinhoodchain.blockscout.com/api" }